base_url = "https://peekme.dev"
title = "peekme"
description = "Select text in Claude Code, Codex CLI, Pi, GitHub Copilot CLI or Kiro CLI output, press Alt+P, and read a short explanation right under it, inside the terminal."
default_language = "en"
compile_sass = false
build_search_index = false
generate_feeds = false

[markdown]
smart_punctuation = false
external_links_target_blank = false

[extra]
version = "0.6.1"
repo = "https://github.com/GregoryBolshakov/peekme"

[[extra.agents]]
page = "claude-code"
caption = 'Claude Code: peek at "Rows Removed by Filter", then ask "How do I fix that?" about "ORDER BY with LIMIT" in a box inside the box. The wheel scrolls the chat with the boxes open, and a click on the underline opens the saved answer.'
media = "claude"
name = "Claude Code"
cmd = "claude"

[[extra.agents]]
page = "codex"
caption = 'Codex CLI: peek at "--force-with-lease", then ask "When is plain --force fine?" about "plain --force". The wheel scrolls the chat with the boxes open, and a click on the underline opens the saved answer.'
media = "codex"
name = "Codex CLI"
cmd = "codex"

