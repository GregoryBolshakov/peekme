name: site

# Builds peekme.dev from site/ and publishes it on GitHub Pages.
on:
  push:
    branches: [main]
    paths: ["site/**", "README.md", "CHANGELOG.md", "Cargo.toml", "src/**", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: README and site agree
        run: python3 site/check.py
      - name: Install Zola
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://github.com/getzola/zola/releases/download/v0.22.1/zola-v0.22.1-x86_64-unknown-linux-gnu.tar.gz | tar xz -C "$HOME/.local/bin" zola
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/zola" --version
      - name: Build
        run: site/build.sh
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
  indexnow:
    # Tells Bing, Yandex, Seznam, Naver, Yep and others that the pages changed.
    # The key is public by design: it is the file site/static/d915f88c0485bb3fcc7c0ab97ebb746d.txt.
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send the sitemap URLs to IndexNow
        run: |
          urls=$(curl -fsSL https://peekme.dev/sitemap.xml | grep -o '<loc>[^<]*' | sed 's/<loc>//' | python3 -c 'import json,sys; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')
          body=$(printf '{"host":"peekme.dev","key":"d915f88c0485bb3fcc7c0ab97ebb746d","keyLocation":"https://peekme.dev/d915f88c0485bb3fcc7c0ab97ebb746d.txt","urlList":%s}' "$urls")
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' -d "$body")
          echo "IndexNow answered $code"
          case "$code" in 200|202) ;; *) exit 1 ;; esac
