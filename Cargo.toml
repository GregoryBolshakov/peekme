[package]
name = "peekme"
version = "0.2.0"
edition = "2024"
description = "Select text in Codex CLI or Claude Code output and get a short explanation right under it, inside the terminal"
authors = ["Gregory Bolshakov"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/GregoryBolshakov/peekme"
readme = "README.md"
keywords = ["codex", "claude", "terminal", "cli", "explain"]
categories = ["command-line-utilities"]

[dependencies]
alacritty_terminal = "0.26"
anyhow = "1"
arboard = { version = "3.6", default-features = false }
crossterm = "0.29"
libc = "0.2"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
unicode-width = "0.2"

[profile.release]
lto = "thin"
